name: msq

x-db-env-hr: &db-env-hr
  DATABASE_URL: postgres://${DB_HR_SVC_USER}:${DB_HR_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_SERVICE: postgres://${DB_SERVICE_USER}:${DB_SERVICE_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  # REQUIRED, not optional: withRoleTx routes tenant_admin to its OWN pool on
  # this URL (@platform/db transaction.ts), so a service that omits it inherits
  # the local-dev value from .env — `@localhost`, which inside a container is the
  # container itself. Every other role keeps working on the two URLs above, so
  # the only symptom is a blanket 500 for tenant_admin. assertDbEnv does not
  # catch it: the var IS set, it just points nowhere.
  DATABASE_URL_TENANT: postgres://${DB_TENANT_SVC_USER}:${DB_TENANT_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DB_PRODUCT_SCOPED_LOGIN: "true"

# See docker-compose.yml for the cross-repo networking note (not solved here).
# These consume prebuilt images shipped to the server.

services:
  hr-service:
    image: msq-hr-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${HR_SERVICE_PORT}
      <<: *db-env-hr
      # Shared blob store: hr-service reads a user's AVATAR (written by
      # identity-service) as the face-verification reference, so both services
      # MUST mount the SAME host directory at the SAME container path. The legacy
      # PHOTO_STORAGE_* vars remain as a fallback (see hr-service config).
      BLOB_STORAGE_DRIVER: ${BLOB_STORAGE_DRIVER:-local}
      BLOB_STORAGE_DIR: ${BLOB_STORAGE_DIR:-/data/blobs}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-2097152}
      # Face verification is in-process (ONNX models in the image); its only
      # setting, FACE_TEMPLATE_KEY, comes from .env via env_file.
    volumes:
      # BLOB_HOST_PATH is the *host* directory (OS-specific: /deployment/...
      # on Linux, C:/... on Windows); BLOB_STORAGE_DIR is the path *inside*
      # the container and must always stay a Linux path -- it is also what the
      # service writes to, via the env var above. identity-service mounts the
      # very same pair (msq-core/docker-compose-linux.yml) so avatars are shared.
      #
      # Long syntax on purpose: build-deploy.ps1 merges with
      # `docker compose config --no-interpolate`, and in the short form a
      # `${VAR}` source is classified as a named volume (it doesn't start with
      # ./ or /), yielding "refers to undefined volume" on the server.
      - type: bind
        source: ${BLOB_HOST_PATH:-./data/blobs}
        target: ${BLOB_STORAGE_DIR:-/data/blobs}
        bind:
          create_host_path: true
    expose:
      - "${HR_SERVICE_PORT}"

  hr-web:
    image: msq-hr-web
    restart: unless-stopped
    env_file: .env
    environment:
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3002:3002"
