name: msq

# Per-product DB login (P1.2/D8) — read/write only hr + read-only iam/entity/geo.
# DB_CONTAINER_NAME/DB_NAME point at msq-core's Postgres container — see the
# cross-repo networking note below.
x-db-env-hr: &db-env-hr
  DATABASE_URL: postgres://${DB_HR_SVC_USER}:${DB_HR_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_SERVICE: postgres://${DB_SERVICE_USER}:${DB_SERVICE_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  # DATABASE_URL_TENANT is REQUIRED even though no query here is obviously
  # tenant-scoped: @platform/db asserts all three pools at startup, and a
  # tenant_admin/super_admin request resolves through the tenant pool. Without
  # it the value fell through to this repo's own .env, whose standalone value
  # is `localhost` — inside a container that is the container itself, so
  # /analytics/dashboard 500'd with `connect ECONNREFUSED ::1:5432` while the
  # plain lead queries on DATABASE_URL worked fine.
  DATABASE_URL_TENANT: postgres://${DB_TENANT_SVC_USER}:${DB_TENANT_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DB_PRODUCT_SCOPED_LOGIN: "true"

x-web-public-args: &web-public-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${GATEWAY_PORT}}
  API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
  NEXT_PUBLIC_PASSWORD_MIN_LENGTH: ${NEXT_PUBLIC_PASSWORD_MIN_LENGTH:-12}
  NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:3000}
  NEXT_PUBLIC_LMS_URL: ${NEXT_PUBLIC_LMS_URL:-http://localhost:3001}
  NEXT_PUBLIC_HR_URL: ${NEXT_PUBLIC_HR_URL:-http://localhost:3002}
  NEXT_PUBLIC_TASK_URL: ${NEXT_PUBLIC_TASK_URL:-http://localhost:3003}
  DB_PRODUCT_SCOPED_LOGIN: "true"

# ── Cross-repo networking (SOLVED — from the platform root) ─────────────────
# This repo owns no Postgres container and no api-gateway/identity-service —
# those live in msq-core. The normal way to run it is therefore from the
# platform root (msq-platforms), whose .env sets COMPOSE_FILE to merge all four
# repos' compose files. Every file here declares the same project name
# (`name: msq`), so the merge puts these services on the SAME default network as
# msq-core's, reachable by container name — no external network to create.
#
# Running this repo standalone from its own directory still works, but then
# DB_CONTAINER_NAME / API_GATEWAY_INTERNAL_URL in its .env must point at
# msq-core's containers by host/IP, since nothing else supplies them.

services:
  hr-service:
    build:
      context: ..
      dockerfile: msq-hrms/services/hr-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${HR_SERVICE_PORT}
      <<: *db-env-hr
      # Attendance punch-photo storage (local driver → Docker volume below).
      # Container paths are hardcoded, NOT interpolated: .env holds *host* paths
      # for natively-run services, which would be meaningless inside Linux.
      PHOTO_STORAGE_DRIVER: ${PHOTO_STORAGE_DRIVER:-local}
      PHOTO_STORAGE_DIR: /data/attendance-photos
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-2097152}
      # Shared blob store: hr-service reads a user's AVATAR (written by
      # identity-service) as the face-verification reference, so both services
      # MUST mount the SAME host directory at the SAME container path. This also
      # TAKES PRECEDENCE over PHOTO_STORAGE_DIR in hr-service's config, so the
      # bind mount below is what punch selfies land in too.
      BLOB_STORAGE_DRIVER: ${BLOB_STORAGE_DRIVER:-local}
      BLOB_STORAGE_DIR: /data/blobs
      # Face verification runs IN-PROCESS (ONNX models baked into the image), so
      # there is no face service to reach. FACE_TEMPLATE_KEY (AES-256-GCM key for
      # hr.face_templates) comes from .env via env_file above; require_face_match
      # is an opt-in per-org rule, so it only matters once an org enables it.
    volumes:
      - attendance-photos:/data/attendance-photos
      # BLOB_HOST_PATH is the *host* directory (OS-specific; forward slashes on
      # Windows); BLOB_STORAGE_DIR is the path *inside* the container and must
      # always stay a Linux path. identity-service mounts the very same pair
      # (msq-core docker-compose.yml) so avatars are shared between them.
      - type: bind
        source: ${BLOB_HOST_PATH:-./data/blobs}
        target: /data/blobs
        bind:
          create_host_path: true
    expose:
      - "${HR_SERVICE_PORT}"

  hr-web:
    build:
      context: ..
      dockerfile: msq-hrms/apps/hr-web/Dockerfile
      args: *web-public-args
    restart: unless-stopped
    env_file: .env
    environment:
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3002:3002"

volumes:
  attendance-photos:
